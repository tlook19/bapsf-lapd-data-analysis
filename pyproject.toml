[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bapsf-lapd-data-analysis"
version = "0.1.0"
description = "Tools for configuring and reading LAPD HDF5 data runs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.10",
  "numpy>=1.24",
  "scipy>=1.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``scripts`` is on the path because the script modules import their siblings by
# bare module name, which only resolves when the script directory itself is
# importable.
pythonpath = ["src", "scripts"]
