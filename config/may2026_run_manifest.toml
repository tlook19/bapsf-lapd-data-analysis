[manifest]
name = "may2026-heat-transport"
data_directory = "data/may2026"
description = "Run manifest for May 2026 LAPD heat transport and radiative cooling experiments."

[geometry]
port_2_z_cm = 182.5
port_spacing_cm = 31.95

[acquisition]
raw_sample_rate_hz = 100000000.0
hardware_average_setting = 4
hardware_average_samples = 16
n_positions = 51
n_shots_per_position = 20
sample_rate_hz = 6250000.0
sample_dt_s = 0.00000016
notes = "Five SIS traces were sampled at 100 MS/s. HDF5 SIS3302 metadata stores Sample averaging (hardware)=4 for all runs; this is treated as a 16-sample hardware average. The first data axis is flattened as n_positions * n_shots_per_position."

[experiment_sets."1"]
label = "nice plasma"
v_bank = 180.0
v_puff = 76.4
description = "Reference plasma condition; discharge voltage/current/power are derived from MSI discharge traces."
runs = ["01", "02", "03", "04", "05", "06", "07", "08"]

[experiment_sets."2"]
label = "low bank 140 V"
v_bank = 140.0
v_puff = 76.4
runs = ["21", "22", "23", "24", "25", "26", "27", "28"]

[experiment_sets."3"]
label = "low bank 100 V"
v_bank = 100.0
v_puff = 76.4
runs = ["31", "32", "33", "34", "35", "36", "37", "38"]

[experiment_sets."4"]
label = "high puff 100 V bank"
v_bank = 100.0
v_puff = 110.0
runs = ["41", "42", "43", "44", "45", "46", "47", "48"]

[trace_defaults.reference_photodiode]
hdf5_path = "Raw data + config/SIS crate/Light_Sweep [Slot 5: SIS 3302 ch 1]"
multiplier = 1.0
gain = 1.0
attenuation = 1.0
normalize_to = "moving_photodiode"
notes = "Fixed reference photodiode; raw voltage is an arbitrary-unit light signal. Repeated shots can be averaged across an experiment set."

[trace_defaults.moving_photodiode]
hdf5_path = "Raw data + config/SIS crate/Light_Sweep [Slot 5: SIS 3302 ch 2]"
multiplier = 1.0
gain = 1.0
attenuation = 1.0
normalize_to = "moving_photodiode"
notes = "Same physical photodiode moved between runs, fixed during each run. Repeated shots can be averaged within a run."

[trace_defaults.isat]
hdf5_path = "Raw data + config/SIS crate/Light_Sweep [Slot 7: SIS 3302 ch 1]"
resistor_ohm = 45.0
gain = 0.844
attenuation = 1.0
multiplier = 1.0
notes = "Ion saturation current. Current = voltage * attenuation / resistor_ohm / gain."

[trace_defaults.i_sweep]
hdf5_path = "Raw data + config/SIS crate/Light_Sweep [Slot 7: SIS 3302 ch 2]"
resistor_ohm = 1.0
gain = 1.195
attenuation = 1.0
multiplier = 1.0
notes = "Langmuir sweep current. Runs 42-48 override resistor_ohm to 3 ohm."

[trace_defaults.v_sweep]
hdf5_path = "Raw data + config/SIS crate/Light_Sweep [Slot 7: SIS 3302 ch 3]"
gain = 1.0
attenuation = 1.0
multiplier = 100.0
notes = "Langmuir sweep voltage. Voltage = trace voltage * 100."

