# Langmuir probe face area calibration — May 2026 LAPD experiment.
# Ion species: He-4  m_i = 4.003 amu
# Calibration time window: 10.0–19.0 ms (stable plasma plateau)
# Primary calibration: experiment set 1 ('nice plasma', 180 V bank)
#
# A_p_L: left (upstream) face area — Isweep channel
# A_p_R: right (downstream) face area — Isat channel
# Probe A: base/reference area copied from probe B; apply the canonical
# empirical factor in config/may2026_probe_a_area_calibration.toml once
# to raw Probe A current in every downstream density/Mach workflow.

[probe_A]
ap_L_cm2 = 0.050919
ap_R_cm2 = 0.055444
ap_L_std_cm2 = 0.001846
ap_R_std_cm2 = 0.001608
estimated = true  # base/reference area copied from probe B

[probe_B]
ap_L_cm2 = 0.050919
ap_R_cm2 = 0.055444
ap_L_std_cm2 = 0.001846
ap_R_std_cm2 = 0.001608

[probe_C]
ap_L_cm2 = 0.045814
ap_R_cm2 = 0.051029
ap_L_std_cm2 = 0.001688
ap_R_std_cm2 = 0.001545

[probe_D]
ap_L_cm2 = 0.058801
ap_R_cm2 = 0.056324
